name: 🔍 Daily Software Discovery

on:
  # Run every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  discover-software:
    name: Discover & Add 10 New Software Entries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🔍 Run auto-discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/discover_software.py

      - name: 💾 Commit and push new entries
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/software_list.csv
          git diff --staged --quiet || git commit -m "🤖 Auto-discovered 10 new software entries [$(date +'%Y-%m-%d')]"
          git push
